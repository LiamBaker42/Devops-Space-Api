name: CI/CD Build and Test Pipeline

# 1. Trigger this pipeline every time code is pushed to the main branch
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-build:
    # 2. Tell GitHub to run this on a clean, virtual Linux server
    runs-on: ubuntu-latest

    steps:
    # Step A: Checkout your code from the repository onto the virtual machine
    - name: Checkout Code
      uses: actions/checkout@v4

    # Step B: Set up Python 3.11 on the virtual machine
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # Step C: Install the dependencies listed in your requirements.txt
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # Step D: Run your automated unit test file via PyTest
    - name: Run Automated Unit Tests
      run: |
        pytest

    # Step E: Test that the Docker image builds cleanly without errors
    - name: Test Docker Build
      run: |
        docker build -t iss-tracker-image:latest .